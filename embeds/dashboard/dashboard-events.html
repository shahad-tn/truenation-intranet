<!--
  TRUE NATION INTRANET — DASHBOARD: UPCOMING EVENTS
  ──────────────────────────────────────────────────
  Embed via Insert → Embed → Embed Code in Google Sites.
  Place on the Home/Dashboard page.
  Add a native Sites heading "UPCOMING EVENTS" above this embed.

  NOTE: This is a VISUAL PROTOTYPE. The final version will pull
  from a Google Calendar feed filtered to the user's campus.

  AppSheet Implementation:
  - Events sourced from Google Calendar API or synced to Sheets
  - Filtered by user's Campus value from Staff Directory
  - Members with multiple campus rows see events from all campuses
  - Shows next 14 days of events, max 5 displayed
  - "Full calendar" link goes to the Calendar & Events page
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: transparent; }

  .events-wrap {
    font-family: 'DM Sans', sans-serif;
    background: #E8E8EC;
    border-radius: 10px;
    padding: 16px 16px 20px;
    box-sizing: border-box;
    width: 100%;
  }
  .event-item {
    display: flex;
    gap: 14px;
    padding: 12px;
    background: white;
    border: 1px solid #BFBFC7;
    border-radius: 8px;
    margin-bottom: 8px;
    transition: box-shadow 0.2s;
  }
  .event-item:hover {
    box-shadow: 0 2px 10px rgba(19,13,10,0.08);
  }
  .event-item:last-child { margin-bottom: 0; }
  .event-date-box {
    width: 48px;
    text-align: center;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .event-month {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #785710;
  }
  .event-day {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: #7C1316;
    line-height: 1;
    margin-top: 2px;
  }
  .event-info { flex: 1; }
  .event-title {
    font-weight: 700;
    font-size: 14px;
    color: #26262A;
    margin-bottom: 2px;
  }
  .event-time {
    font-size: 12px;
    color: #9a8e87;
  }
  .event-campus {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #785710;
    background: white;
    border: 1px solid #BFBFC7;
    padding: 2px 8px;
    border-radius: 100px;
    display: inline-block;
    margin-top: 4px;
  }
  .events-footer {
    text-align: center;
    margin-top: 12px;
  }
  .events-footer a {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #785710;
    text-decoration: none;
  }
  .events-footer a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .event-date-box { width: 40px; }
    .event-day { font-size: 20px; }
  }
</style>

<!-- [REPLACE] All content dynamically populated from Google Calendar -->

<script>
  (function(){
    function sendHeight(){
      var h=document.body?document.body.scrollHeight:0;
      window.parent.postMessage({type:'tnic-height',height:h,id:'dashboard_events'},'*');
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',sendHeight);}
    else{sendHeight();}
    window.addEventListener('resize',sendHeight);
    if(window.ResizeObserver){new ResizeObserver(sendHeight).observe(document.body);}
  })();
</script>
