<!--
  TRUE NATION INTRANET — DASHBOARD IDENTITY CARD
  ───────────────────────────────────────────────
  Embed via Insert → Embed → Embed Code in Google Sites.
  Place at the TOP of the My Dashboard page, above all other embeds.
  No native Sites heading needed — the card IS the header.

  LIVE DATA: This embed wraps the identity widget served by profile-editor.gs.
  It shows the logged-in user's real name, department, branch, and campus
  from the Staff Directory sheet. Greeting adjusts to the user's local time of day.

  WIDGET URL:
    [deployment URL]?widget=identity
  Replace [deployment URL] with the profile editor deployment URL:
    https://script.google.com/a/macros/truenation.org/s/AKfycbzvYnsSNAUzqif4FLxGa00w7T5FEQaF7lXY5hOMPbDmLPvluaGzg5KX5LF6f5Y3-1tK/exec

  HEIGHT:
    Desktop: 140px   (wine gradient card with 3 meta tags)
    Mobile (≤480px):  170px  (tags may wrap to 2 lines)
    Increase if tags wrap further.

  DEPLOYMENT NOTE:
    When profile-editor.gs is updated, Deploy → Manage Deployments → New version.
    The URL and widget parameter do not change.
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }

  .id-wrap {
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
  }

  .id-wrap iframe {
    width: 100%;
    height: 140px;
    border: none;
    display: block;
    border-radius: 14px;
  }

  @media (max-width: 480px) {
    .id-wrap iframe { height: 170px; }
  }
</style>

<div class="id-wrap">
  <iframe
    src="https://script.google.com/a/macros/truenation.org/s/AKfycbzvYnsSNAUzqif4FLxGa00w7T5FEQaF7lXY5hOMPbDmLPvluaGzg5KX5LF6f5Y3-1tK/exec?widget=identity"
    title="My Identity"
    allowfullscreen>
  </iframe>
</div>

<script>
  (function(){
    function sendHeight(){
      var h=document.body?document.body.scrollHeight:0;
      window.parent.postMessage({type:'tnic-height',height:h,id:'dashboard_identity'},'*');
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',sendHeight);}
    else{sendHeight();}
    window.addEventListener('resize',sendHeight);
    if(window.ResizeObserver){new ResizeObserver(sendHeight).observe(document.body);}
  })();
</script>
