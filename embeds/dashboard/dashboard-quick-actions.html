<!--
  TRUE NATION INTRANET — DASHBOARD QUICK ACTIONS
  ───────────────────────────────────────────────
  Embed via Insert → Embed → Embed Code in Google Sites.
  Place BELOW the Identity Card embed on the My Dashboard page.
  Add a native Sites heading "QUICK ACTIONS" above this embed.

  Two action tiles: Submit Announcement + Submit Request.
  Both are placeholders — processes not yet built out.

  [REPLACE] Update each href with the actual Google Form URLs when processes are set up.
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: transparent; }

  .qa-wrap {
    font-family: 'DM Sans', sans-serif;
    background: #E8E8EC;
    border-radius: 10px;
    padding: 16px 16px 20px;
    box-sizing: border-box;
    width: 100%;
  }
  .qa-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .qa-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: white;
    border: 1px solid #BFBFC7;
    border-radius: 10px;
    padding: 22px 14px 18px;
    text-decoration: none;
    color: #26262A;
    box-shadow: 0 2px 6px rgba(19,13,10,0.06);
    transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
    cursor: pointer;
  }
  .qa-tile:hover {
    box-shadow: 0 5px 16px rgba(19,13,10,0.12);
    transform: translateY(-2px);
    border-color: #785710;
  }
  .qa-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .qa-announce .qa-icon { background: #FFF3E0; }
  .qa-request  .qa-icon { background: #E8F0FE; }
  .qa-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #56565E;
    text-align: center;
    line-height: 1.3;
  }
  .qa-desc {
    font-size: 11px;
    color: #9a8e87;
    text-align: center;
    line-height: 1.4;
  }

  @media (max-width: 400px) {
    .qa-grid { grid-template-columns: 1fr; }
  }
</style>

<div class="qa-wrap">
  <div class="qa-grid">

    <!-- [REPLACE] href with actual Google Form URL when Submit Announcement process is built -->
    <a class="qa-tile qa-announce" href="#" target="_blank">
      <div class="qa-icon">📢</div>
      <div class="qa-label">Submit Announcement</div>
      <div class="qa-desc">Post to the intranet feed</div>
    </a>

    <!-- [REPLACE] href with actual Google Form URL when Submit Request process is built -->
    <a class="qa-tile qa-request" href="#" target="_blank">
      <div class="qa-icon">📋</div>
      <div class="qa-label">Submit Request</div>
      <div class="qa-desc">IT, facilities, or general requests</div>
    </a>

  </div>
</div>

<script>
  (function(){
    function sendHeight(){
      var h=document.body?document.body.scrollHeight:0;
      window.parent.postMessage({type:'tnic-height',height:h,id:'dashboard_quick_actions'},'*');
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',sendHeight);}
    else{sendHeight();}
    window.addEventListener('resize',sendHeight);
    if(window.ResizeObserver){new ResizeObserver(sendHeight).observe(document.body);}
  })();
</script>
