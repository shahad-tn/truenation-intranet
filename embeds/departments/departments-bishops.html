  [REPLACE] Each card's href with the actual anchor link to the bishop's

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  .di-wrap {
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    background: #E8E8EC;
    border-radius: 10px;
    padding: 16px 16px 20px;
    box-sizing: border-box;
  }

  /* Department card grid */
  .di-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  /* Individual card */
  a.di-card {
    display: flex;
    flex-direction: column;
    background: white;
    border: 1px solid #BFBFC7;
    border-radius: 8px;
    padding: 18px 16px 14px;
    text-decoration: none;
    color: #26262A;
    box-shadow: 0 2px 6px rgba(19,13,10,0.06);
    transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
    min-height: 100px;
  }

  a.di-card:hover {
    box-shadow: 0 5px 16px rgba(19,13,10,0.12);
    transform: translateY(-2px);
    border-color: #785710;
  }

  .di-badge {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 2px 9px;
    border-radius: 100px;
    margin-bottom: 8px;
    align-self: flex-start;
  }
  .badge-bi { background: #8C1C1C; color: #F2F2F3; }

  .di-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.0625rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #7C1316;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .di-lead {
    font-size: 13px;
    color: #56565E;
    margin-top: auto;
    padding-top: 8px;
  }

  .di-lead-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #785710;
    display: block;
    margin-bottom: 2px;
  }

  .di-arrow {
    display: inline-block;
    color: #785710;
    font-size: 14px;
    margin-left: 4px;
    transition: transform 0.2s;
  }
  a.di-card:hover .di-arrow { transform: translateX(3px); }

  @media (max-width: 500px) {
    .di-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<div class="di-wrap">

  <div class="di-grid">

    <a class="di-card" href="/leadership/bishops#tazayawan"><!-- [REPLACE] href -->
      <span class="di-badge badge-bi">Bishop</span>
      <div class="di-name">Bishop Tazayawan</div>
      <div class="di-lead">
        <span class="di-lead-label">Campus</span>
        Los Angeles, CA · HQ <span class="di-arrow">→</span>
      </div>
    </a>

    <a class="di-card" href="/leadership/bishops#yahzeqel"><!-- [REPLACE] href -->
      <span class="di-badge badge-bi">Bishop</span>
      <div class="di-name">Bishop Yahzeqel</div>
      <div class="di-lead">
        <span class="di-lead-label">Campuses</span>
        Detroit, MI · Macon, GA <span class="di-arrow">→</span>
      </div>
    </a>

    <a class="di-card" href="/leadership/bishops#banayah"><!-- [REPLACE] href -->
      <span class="di-badge badge-bi">Bishop</span>
      <div class="di-name">Bishop Banayah</div>
      <div class="di-lead">
        <span class="di-lead-label">Campuses</span>
        Manila, Philippines · Cebu, Philippines <span class="di-arrow">→</span>
      </div>
    </a>

    <a class="di-card" href="/leadership/bishops#izar"><!-- [REPLACE] href -->
      <span class="di-badge badge-bi">Bishop</span>
      <div class="di-name">Bishop Izar</div>
      <div class="di-lead">
        <span class="di-lead-label">Campuses</span>
        Kumasi, Ghana · Accra, Ghana <span class="di-arrow">→</span>
      </div>
    </a>

  </div>

</div>

<script>
  (function(){
    function sendHeight(){
      var h=document.body?document.body.scrollHeight:0;
      window.parent.postMessage({type:'tnic-height',height:h,id:'departments_bishops'},'*');
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',sendHeight);}
    else{sendHeight();}
    window.addEventListener('resize',sendHeight);
    if(window.ResizeObserver){new ResizeObserver(sendHeight).observe(document.body);}
  })();
</script>
