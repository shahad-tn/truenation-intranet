<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  .ql-wrap {
    background: #E8E8EC;
    border-radius: 10px;
    padding: 16px 16px 20px;
    box-sizing: border-box;
    width: 100%;
  }

  .ql-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
  }

  .ql-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 12px 20px;
    background: white;
    border: 1px solid #BFBFC7;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(19,13,10,0.07);
    text-decoration: none;
    color: #26262A;
    min-height: 110px;
    transition: box-shadow 0.2s, transform 0.15s;
  }

  .ql-tile:hover {
    box-shadow: 0 6px 18px rgba(19,13,10,0.13);
    transform: translateY(-3px);
    border-color: #785710;
  }

  .ql-icon {
    font-size: 3rem;
    margin-bottom: 14px;
    line-height: 1;
  }

  .ql-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.125rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7C1316;
    line-height: 1.2;
  }

  @media (max-width: 600px) {
    .ql-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
  @media (max-width: 400px) {
    .ql-grid { grid-template-columns: 1fr; gap: 8px; }
  }
  @media (min-width: 601px) and (max-width: 800px) {
    .ql-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
