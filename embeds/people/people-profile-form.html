  Native Sites heading: "Update Your Profile"

  Users are auto-identified via Session.getActiveUser().getEmail().

  Deployment URL:
    https://script.google.com/a/macros/truenation.org/s/AKfycbzvYnsSNAUzqif4FLxGa00w7T5FEQaF7lXY5hOMPbDmLPvluaGzg5KX5LF6f5Y3-1tK/exec

  TO UPDATE THE CODE:
    1. Edit profile-editor.gs or profile-editor-ui.html in the standalone project
    2. Deploy → Manage Deployments → Edit (pencil) → Version: New version → Deploy
    3. The URL stays the same — no changes needed here.

  FIELDS:

    Read-only: Department, Role/Title, Campus

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .profile-wrap {
    font-family: 'DM Sans', sans-serif;
    width: 100%;
    background: #E8E8EC;
    border-radius: 10px;
    padding: 16px 16px 20px;
    overflow: hidden;
    box-sizing: border-box;
  }

  .profile-embed-wrap {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: white;
    border: 1px solid #BFBFC7;
    box-shadow: 0 2px 6px rgba(19,13,10,0.05);
  }

  .profile-embed-wrap iframe {
    width: 100%;
    height: 560px;
    border: none;
    display: block;
  }

  @media (max-width: 500px) {
    .profile-embed-wrap iframe { height: 620px; }
  }
</style>

<div class="profile-wrap">
  <div class="profile-embed-wrap">
    <iframe
      src="https://script.google.com/a/macros/truenation.org/s/AKfycbzvYnsSNAUzqif4FLxGa00w7T5FEQaF7lXY5hOMPbDmLPvluaGzg5KX5LF6f5Y3-1tK/exec"
      allowfullscreen>
    </iframe>
  </div>
</div>

<script>
  (function(){
    function sendHeight(){
      var h = document.body ? document.body.scrollHeight : 0;
      window.parent.postMessage({ type: 'tnic-height', height: h, id: 'profile-form' }, '*');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sendHeight);
    } else {
      sendHeight();
    }
    window.addEventListener('resize', sendHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(sendHeight).observe(document.body);
    }
  })();
</script>
