<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#E8E8EC;color:#26262A;font-family:'DM Sans',Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.55;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .box{background:#fff;border:1px solid #BFBFC7;border-radius:12px;max-width:520px;padding:38px 34px;text-align:center;}
  .mark{width:60px;height:60px;border-radius:50%;background:#D8D8DE;color:#7C1316;font-size:30px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;
    font-size:25px;color:#7C1316;margin:0 0 10px;}
  p{margin:0 0 14px;}
  .who{background:#D8D8DE;border-radius:8px;padding:12px 15px;font-size:13.5px;color:#56565E;margin:20px 0 0;}
  .who b{color:#26262A;}
  a.btn{display:inline-block;background:#7C1316;color:#F2F2F3;text-decoration:none;font-weight:700;
    padding:12px 26px;border-radius:8px;margin-top:18px;}
  a.btn:hover{background:#5E0E10;}
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">&#9679;</div>
    <h1>Access Needed</h1>
    <p><?= message ?></p>
    <p style="font-size:14px;color:#56565E;">Access to intranet pages is managed through Google Groups. If you should have this access, ask IT to add you to the right group &mdash; no one needs to change any code.</p>
    <a class="btn" href="mailto:<?= contact ?>?subject=Intranet%20access%20request">Request access</a>
    <div class="who">
      Signed in as <b><?= email ? email : 'not signed in' ?></b><? if (page) { ?> &middot; page: <b><?= page ?></b><? } ?>
    </div>
  </div>
</body>
</html>
