<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<?!= include('styles') ?>
<style>
  :root{ --base:20px; }
  body{font-size:var(--base);line-height:1.55;}
  .rs-top{background:var(--wine);color:var(--onwine);padding:20px 20px 18px;}
  .rs-in{max-width:820px;margin:0 auto;}
  .rs-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.9em;
    line-height:1.1;letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;}
  .rs-meta{font-size:.8em;margin:0;color:var(--onwine);opacity:.92;}
  .rs-meta strong{font-weight:700;}
  .rs-bar-row{max-width:820px;margin:0 auto;padding:14px 20px 0;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .rs-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.72em;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-right:4px;}
  .rs-tab{font-size:.78em;font-weight:500;padding:8px 14px;border:2px solid var(--line-strong);
    background:#fff;color:var(--ink);border-radius:999px;cursor:pointer;}
  .rs-tab:hover{border-color:var(--gold);}
  .rs-tab[aria-selected="true"]{background:var(--wine);border-color:var(--wine);color:var(--onwine);font-weight:700;}
  .rs-btn{font-size:.78em;font-weight:500;padding:8px 14px;border:2px solid var(--line-strong);
    background:#fff;color:var(--ink);border-radius:6px;cursor:pointer;}
  .rs-btn:hover{border-color:var(--gold);}
  .rs-prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.75em;color:var(--ink);}
  .rs-track{width:110px;height:8px;background:var(--surface);border-radius:999px;overflow:hidden;}
  .rs-fill{height:100%;width:0%;background:var(--wine);transition:width .2s ease;}
  .rs-legend{max-width:820px;margin:0 auto;padding:12px 20px 0;font-size:.7em;color:var(--ink);
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .rs-wrap{max-width:820px;margin:0 auto;padding:22px 20px 60px;}
  .rs-part{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05em;
    letter-spacing:.18em;text-transform:uppercase;color:var(--wine);text-align:center;
    margin:34px 0 18px;padding:10px 0;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);}
  .rs-part:first-of-type{margin-top:8px;}
  .rs-sec{background:#fff;border:1px solid var(--line);border-left:6px solid var(--wine);
    border-radius:8px;padding:18px 20px;margin:0 0 16px;}
  .rs-sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px;}
  .rs-sec-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25em;
    letter-spacing:.08em;text-transform:uppercase;color:var(--wine);margin:0;}
  .rs-tag{font-size:.62em;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .rs-tag-st{background:var(--surface);color:var(--ink);}
  .rs-tag-new{background:var(--gold);color:var(--ink-dk);}
  .rs-line{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--surface);}
  .rs-line:first-of-type{border-top:none;padding-top:0;}
  .rs-check{flex:0 0 auto;width:26px;height:26px;margin-top:2px;border:2px solid var(--gold);
    border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-size:15px;line-height:1;color:var(--wine);padding:0;}
  .rs-check[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:var(--onwine);}
  .rs-text{flex:1 1 auto;margin:0;}
  .rs-line[data-read="true"] .rs-text{opacity:.42;text-decoration:line-through;text-decoration-thickness:1px;}
  .rs-dir{font-style:italic;color:var(--muted);}
  .rs-dirtag{font-size:.55em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    background:var(--surface);color:var(--muted);padding:2px 7px;border-radius:4px;margin-left:6px;
    vertical-align:middle;font-style:normal;}
  .rs-attrib{display:block;margin-top:5px;font-size:.68em;color:var(--muted);}
  .rs-attrib b{color:var(--wine);}
  .rs-end{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--wine);margin:34px 0 0;
    padding-top:18px;border-top:3px solid var(--gold);font-size:.95em;}
  @media (max-width:520px){ :root{--base:19px;} .rs-title{font-size:1.6em;} .rs-prog{margin-left:0;width:100%;} }
  @media print{
    .rs-bar-row,.rs-legend,.rs-check{display:none !important;}
    body{background:#fff;font-size:13pt;}
    .rs-top{background:#fff;color:var(--ink-dk);border-bottom:4px solid var(--wine);}
    .rs-meta{color:var(--ink-dk);}
    .rs-sec{break-inside:avoid;border-color:#ccc;}
  }
</style>
</head>
<body>

<header class="rs-top">
  <div class="rs-in">
    <p class="tn-kick">True Nation &middot; Announcements</p>
    <h1 class="rs-title" id="svcTitle">Loading&hellip;</h1>
    <p class="rs-meta" id="svcMeta"></p>
  </div>
</header>

<div class="rs-bar-row" id="svcPicker" role="group" aria-label="Choose a service" hidden>
  <span class="rs-lbl">Service:</span>
</div>

<div class="rs-bar-row" id="tools" hidden>
  <button class="rs-btn" id="btnSmaller" type="button">A&minus; Smaller</button>
  <button class="rs-btn" id="btnBigger" type="button">A+ Larger</button>
  <button class="rs-btn" id="btnPrint" type="button">Print</button>
  <button class="rs-btn" id="btnReset" type="button">Reset checkmarks</button>
  <button class="rs-btn" id="btnRead" type="button" hidden>Mark service as read</button>
  <div class="rs-prog">
    <span id="progText">0 of 0 read</span>
    <div class="rs-track" aria-hidden="true"><div class="rs-fill" id="progFill"></div></div>
  </div>
</div>

<div class="rs-legend" id="legend" hidden>
  <span class="rs-tag rs-tag-st">Standing</span> <span>Read every service.</span>
  <span class="rs-tag rs-tag-new">Submitted</span> <span>Approved for this date only.</span>
</div>

<main class="rs-wrap" id="body"><div class="tn-load" id="loading">Loading the script&hellip;</div></main>
<div class="tn-toast" id="toast" role="status" aria-live="polite"></div>

<script>
var DATA = null, lineN = 0;
var $ = function(id){ return document.getElementById(id); };
function esc(s){return String(s).replace(/&(?!#?\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function qs(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}

function load(dateIso){
  $('loading') && ($('loading').textContent = 'Loading the script…');
  google.script.run.withSuccessHandler(render).withFailureHandler(function(e){
    $('body').innerHTML = '<div class="tn-load"><b>Could not load.</b><br>' + esc(e.message) + '</div>';
  }).getScriptFor(dateIso || '');
}

function render(d){
  DATA = d;
  $('svcTitle').textContent = d.title;
  $('svcMeta').innerHTML = esc(d.dateLabel) + (d.reader ? ' &nbsp;&middot;&nbsp; Reader: <strong>' + esc(d.reader) + '</strong>' : '');

  var picker = $('svcPicker');
  picker.innerHTML = '<span class="rs-lbl">Service:</span>';
  d.services.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'rs-tab'; b.type = 'button';
    b.setAttribute('aria-selected', s.iso === d.dateIso ? 'true' : 'false');
    b.textContent = s.label;
    b.addEventListener('click', function(){ load(s.iso); window.scrollTo({top:0,behavior:'smooth'}); });
    picker.appendChild(b);
  });
  picker.hidden = false; $('tools').hidden = false; $('legend').hidden = false;
  $('btnRead').hidden = !d.canManage;

  lineN = 0;
  var html = '';
  d.parts.forEach(function(p){
    html += '<h2 class="rs-part">' + esc(p.part) + '</h2>';
    p.sections.forEach(function(sec){
      html += '<div class="rs-sec"><div class="rs-sec-head"><h3 class="rs-sec-name">' + esc(sec.name) + '</h3>';
      html += '<span class="rs-tag rs-tag-st">Standing</span>';
      if(sec.hasSubmitted) html += ' <span class="rs-tag rs-tag-new">+ Submitted</span>';
      html += '</div>';
      sec.lines.forEach(function(l){ html += lineHTML(l); });
      html += '</div>';
    });
  });
  if(!d.parts.length){
    html = '<div class="db-empty" style="background:#fff;border:2px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;color:var(--muted);">' +
      'No standing text has been set up for this service type yet.</div>';
  }
  html += '<p class="rs-end">End of announcements</p>';
  $('body').innerHTML = html;
  wire(); updateProgress();
}

function lineHTML(l){
  var id = 'ln' + (++lineN);
  var attrib = l.submitted
    ? '<span class="rs-attrib">Submitted by <b>' + esc(l.by || '') + '</b>' +
      (l.contact && l.contact !== l.by ? ' &middot; ask ' + esc(l.contact) : '') + '</span>'
    : '';
  return '<div class="rs-line" data-read="false">' +
    '<button class="rs-check" type="button" aria-pressed="false" aria-label="Mark this line as read"></button>' +
    '<p class="rs-text' + (l.direction ? ' rs-dir' : '') + '" id="' + id + '">' + esc(l.text) +
    (l.direction ? '<span class="rs-dirtag">Stage direction</span>' : '') + attrib + '</p></div>';
}

function wire(){
  var checks = document.querySelectorAll('.rs-check');
  for(var i=0;i<checks.length;i++){
    checks[i].addEventListener('click', function(){
      var on = this.getAttribute('aria-pressed') === 'true';
      this.setAttribute('aria-pressed', on ? 'false' : 'true');
      this.innerHTML = on ? '' : '&#10003;';
      this.closest('.rs-line').setAttribute('data-read', on ? 'false' : 'true');
      updateProgress();
    });
  }
}

function updateProgress(){
  var all = document.querySelectorAll('.rs-check');
  var done = document.querySelectorAll('.rs-check[aria-pressed="true"]');
  $('progText').textContent = done.length + ' of ' + all.length + ' read';
  $('progFill').style.width = (all.length ? Math.round(done.length/all.length*100) : 0) + '%';
}

var sizes = [17,19,21,23,26,29], sizeIdx = 1;
function applySize(){ document.documentElement.style.setProperty('--base', sizes[sizeIdx] + 'px'); }
$('btnBigger').addEventListener('click', function(){ if(sizeIdx < sizes.length-1){ sizeIdx++; applySize(); } });
$('btnSmaller').addEventListener('click', function(){ if(sizeIdx > 0){ sizeIdx--; applySize(); } });
$('btnPrint').addEventListener('click', function(){ window.print(); });
$('btnReset').addEventListener('click', function(){
  var checks = document.querySelectorAll('.rs-check');
  for(var i=0;i<checks.length;i++){
    checks[i].setAttribute('aria-pressed','false'); checks[i].innerHTML = '';
    checks[i].closest('.rs-line').setAttribute('data-read','false');
  }
  updateProgress();
});
$('btnRead').addEventListener('click', function(){
  if(!DATA || !window.confirm('Mark every approved announcement for this service as read? They stop appearing in the queue as pending.')) return;
  var b = this; b.disabled = true;
  google.script.run.withSuccessHandler(function(r){
    b.disabled = false; toast(r.count + ' announcement' + (r.count===1?'':'s') + ' marked as read.');
  }).withFailureHandler(function(e){ b.disabled = false; toast(e.message, true); })
    .markServiceRead(DATA.dateIso);
});

var tEl = $('toast'), tT;
function toast(m, bad){
  tEl.textContent = m; tEl.className = 'tn-toast show' + (bad ? ' bad' : '');
  clearTimeout(tT); tT = setTimeout(function(){ tEl.className = 'tn-toast'; }, 3500);
}

applySize();
load(qs('date'));
</script>
</body>
</html>
