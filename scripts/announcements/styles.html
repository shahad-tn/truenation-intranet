<!-- ── TNIC ANNOUNCEMENTS — shared head ──────────────────────────────────
     Three layers, in cascade order:
       1. FOUC guard        - ground + font only, BEFORE brand.css so
                              brand.css wins once it loads. After it would
                              pin the body light and break dark mode.
       2. brand.css         - org-wide tokens, reset, type, buttons, form
                              controls, focus ring, [hidden]. Served from
                              Vercel; edit there and every page updates
                              with no Apps Script redeploy.
       3. announcements-only- the .tn-* chrome and the approval status
                              colours, which only this project uses.
     EVERY page in this project must include('styles'). submit.html and
     access.html used to carry their own stylesheet instead, which is why a
     fix to this file once never reached them and left a confirmation panel
     showing under the submit form.
──────────────────────────────────────────────────────────────────────── -->
<style>
  body{background:#E8E8EC;color:#26262A;font-family:'DM Sans',Helvetica,Arial,sans-serif;}
</style>

<link rel="stylesheet" href="https://portal.truenation.org/brand.css">

<style>
  /* Approval states. Not in brand.css because only announcements has a
     "rejected" state distinct from a general error. */
  :root{
    --no:#7A2118; --no-bg:#F3E2E0;
    /* Warm tints for pinned cards and contenteditable regions, and the
       table row hover. Hardcoded near-whites here would render as light
       blocks under light text in dark mode. */
    --edit-bg:#FFFDF6; --row-hover:#F4F4F6;
  }
  :root[data-theme="dark"]{
    --no:#EC9A92; --no-bg:#3A1E1B;
    --edit-bg:#2E2818; --row-hover:#332F3B;
  }

  h4{font-family:var(--font-head);text-transform:uppercase;margin:0;}
  button{font-family:var(--font-body);}

  /* ── Announcements chrome ── */
  .tn-top{background:var(--wine);color:var(--onwine);padding:18px 22px 0;
    border-bottom:2px solid var(--panel-edge);}
  .tn-top.pad{padding-bottom:18px;}
  .tn-in{max-width:1060px;margin:0 auto;}
  .tn-kick{font-family:var(--font-head);font-weight:600;font-size:12px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--gold-on-wine);margin:0 0 3px;}
  .tn-h1{font-weight:700;font-size:30px;letter-spacing:.03em;line-height:1.1;}
  .tn-who{font-size:13px;opacity:.9;margin:4px 0 16px;}
  .tn-wrap{max-width:1060px;margin:0 auto;padding:22px 22px 70px;}

  .tn-btn{font-size:13px;font-weight:600;padding:8px 14px;border-radius:6px;cursor:pointer;
    border:2px solid var(--line-strong);background:var(--card);color:var(--ink);}
  .tn-btn:hover{border-color:var(--accent);}
  .tn-btn[disabled]{opacity:.55;cursor:default;}
  .tn-btn-go{background:var(--wine);border-color:var(--wine);color:var(--onwine);}
  .tn-btn-go:hover{background:var(--wine-dk);border-color:var(--wine-dk);}
  .tn-btn-quiet{color:var(--muted);}

  .tn-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
    background:var(--ink-dk);color:#F2F2F3;padding:12px 22px;border-radius:8px;
    font-size:14px;font-weight:500;box-shadow:0 6px 22px rgba(0,0,0,.28);
    transition:transform .25s ease;z-index:60;max-width:90vw;text-align:center;}
  .tn-toast.show{transform:translateX(-50%) translateY(0);}
  .tn-toast.bad{background:var(--no);color:#F2F2F3;}
  :root[data-theme="dark"] .tn-toast.bad{color:var(--ink-dk);}

  .tn-load{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
