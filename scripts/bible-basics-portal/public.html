<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--wine:#7C1316;--gold:#C9972C;--snow:#FAF8F4;--cream:#F2EDE4;--bark:#3D2E28;--ink:#130D0A;--line:#E4DCCE}
  *{box-sizing:border-box}
  body{margin:0;background:var(--snow);color:var(--ink);font-family:'DM Sans',system-ui,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 50px}
  h2{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:24px;font-weight:700;color:var(--wine);margin:26px 0 12px}
  .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .datebox{flex:none;width:60px;text-align:center;background:var(--wine);color:var(--cream);border-radius:10px;padding:7px 4px}
  .datebox .mo{font-family:'Barlow Condensed',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .datebox .dy{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;line-height:1}
  .info{flex:1;min-width:0}
  .info .t{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;color:var(--ink);text-transform:uppercase}
  .info .m{font-size:13px;color:var(--bark)}
  .pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px;background:var(--cream);color:var(--bark)}
  .pill.cx{background:#F7C1C1;color:#791F1F}
  .loading{text-align:center;padding:50px;color:var(--bark)}
  .spin{width:30px;height:30px;border:4px solid var(--cream);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading"><div class="spin"></div>Loading schedule…</div>
  <div id="out"></div>
</div>
<script>
  var CLASS_KEY='<?= classKey ?>';
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function ordinal(n){return ['','1st','2nd','3rd','4th','5th'][n]||n+'th';}
  function dayName(iso){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(iso.replace(/-/g,'/')).getDay()];}
  google.script.run.withSuccessHandler(function(list){
    document.getElementById('loading').style.display='none';
    var h='';
    list.forEach(function(c){
      h+='<h2>'+esc(c.name)+'</h2>';
      c.schedule.forEach(function(r){
        var pill=r.canceled?'<span class="pill cx">Canceled</span>':'<span class="pill">'+esc(r.teacherName||'—')+'</span>';
        h+='<div class="row"><div class="datebox"><div class="mo">'+r.month+'</div><div class="dy">'+r.day+'</div></div>'+
           '<div class="info"><div class="t">'+(r.topicName?esc(r.topicName):'To be announced')+'</div><div class="m">'+dayName(r.iso)+' · '+ordinal(r.nth)+' of month</div></div>'+pill+'</div>';
      });
    });
    document.getElementById('out').innerHTML=h||'<p>No schedule available.</p>';
  }).withFailureHandler(function(e){document.getElementById('loading').innerHTML='<p style="color:#7C1316">'+esc(e.message||e)+'</p>';}).getPublicSchedule(CLASS_KEY);
</script>
</body>
</html>
