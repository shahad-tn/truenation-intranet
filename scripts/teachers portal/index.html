<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--wine:#7C1316;--gold:#C9972C;--snow:#FAF8F4;--cream:#F2EDE4;--bark:#3D2E28;--ink:#130D0A;--line:#E4DCCE;--red:#7C1316}
  *{box-sizing:border-box}
  body{margin:0;background:var(--snow);color:var(--ink);font-family:'DM Sans',system-ui,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.hd{font-family:'Barlow Condensed','DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0}
  .wrap{max-width:980px;margin:0 auto;padding:22px 20px 60px}
  .whoami-bar{display:flex;justify-content:flex-end;margin:0 0 6px}
  .whoami{display:inline-flex;align-items:center;gap:8px;color:var(--bark);font-size:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 13px}
  .whoami .dot{width:9px;height:9px;border-radius:50%;background:#6FCF97;flex:none}
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:8px 0 22px;flex-wrap:wrap}
  .tab{appearance:none;border:none;background:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:18px;font-weight:600;color:var(--bark);padding:10px 16px;border-radius:8px 8px 0 0;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab[aria-selected="true"]{color:var(--wine);border-bottom-color:var(--gold);background:#fff}
  .tab.admin[aria-selected="true"]{border-bottom-color:#BA7517}
  .tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .panel{display:none}.panel.active{display:block}
  .prog{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .prog .num{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--wine);line-height:1}
  .prog .lbl{font-size:13px;color:var(--bark);text-transform:uppercase;letter-spacing:.05em}
  .bar{flex:1;min-width:160px;height:12px;background:var(--cream);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold);width:2%}
  .prog .note{font-size:13px;color:var(--bark);flex-basis:100%;margin-top:2px}
  h3.sec{font-size:20px;color:var(--wine);margin:8px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:26px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .card h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-size:19px;font-weight:600;color:var(--wine);margin:0}
  .ref{display:inline-block;font-size:12px;color:var(--bark);background:var(--cream);border-radius:6px;padding:2px 8px;align-self:flex-start}
  .card p{margin:0;font-size:14px;color:var(--bark);flex:1}
  .btn{appearance:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;border-radius:9px;padding:9px 13px;border:2px solid var(--wine);background:var(--wine);color:#fff}
  .btn:hover{transform:translateY(-1px)}.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .btn.ghost{background:#fff;color:var(--wine)}.btn.sm{padding:6px 11px;font-size:13px}
  .btn.amber{border-color:#BA7517;background:#BA7517}.btn.amber.ghost{background:#fff;color:#8C5A0E}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:9px;flex-wrap:wrap}
  .datebox{flex:none;width:60px;text-align:center;background:var(--wine);color:var(--cream);border-radius:10px;padding:7px 4px}
  .datebox .mo{font-family:'Barlow Condensed',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .datebox .dy{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;line-height:1}
  .row .info{flex:1;min-width:150px}
  .row .info .t{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;color:var(--ink);text-transform:uppercase}
  .row .info .m{font-size:13px;color:var(--bark)}
  .pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px}
  .pill.you{background:#F3E3C6;color:#6B4E10}.pill.other{background:var(--cream);color:var(--bark)}
  .pill.open{background:#EDE6DA;color:#6b5d4b;border:1px dashed #C9BCA6}.pill.cx{background:#F7C1C1;color:#791F1F}.pill.ov{background:#E6F1FB;color:#0C447C}
  .empty{color:var(--bark);font-size:14px;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
  .subnote{font-size:13px;color:var(--bark);margin:0 0 14px}
  .adminbox{background:#FFFBF3;border:1px solid #EAD9B5;border-radius:12px;padding:16px;margin-bottom:20px}
  .adminbox h3{font-size:17px;color:#8C5A0E;margin:0 0 12px}
  .rotrow,.assignrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .rotrow label{font-size:13px;color:var(--bark);min-width:96px}
  input,select{font-family:'DM Sans',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
  .classpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .classpick .btn{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase}
  .scrim{position:fixed;inset:0;background:rgba(19,13,10,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .scrim.show{display:flex}
  .modal{background:var(--snow);border-radius:16px;max-width:460px;width:100%;padding:24px;border-top:6px solid var(--gold);max-height:86vh;overflow:auto}
  .modal.amber{border-top-color:#BA7517}
  .modal h2{font-size:22px;color:var(--wine);font-weight:700}.modal.amber h2{color:#8C5A0E}
  .modal .sub{font-size:14px;color:var(--bark);margin:6px 0 16px}
  fieldset{border:none;padding:0;margin:0}legend{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--bark);margin:14px 0 8px}
  .opt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
  .opt:has(input:checked){border-color:var(--gold);background:#FFFDF7;box-shadow:0 0 0 2px #F3E3C6}
  .opt input{width:18px;height:18px;accent-color:var(--wine)}
  .opt .od{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;color:var(--ink);text-transform:uppercase}
  .field{margin-bottom:12px}.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--bark);margin-bottom:5px}
  .field input,.field select{width:100%}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90%}
  .toast.err{background:var(--red)}.toast.show{display:block}
  .loading{text-align:center;padding:60px 20px;color:var(--bark)}
  .spin{width:34px;height:34px;border:4px solid var(--cream);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading"><div class="spin" aria-hidden="true"></div>Loading&hellip;</div>
  <div id="main" style="display:none">
    <div class="whoami-bar"><div class="whoami"><span class="dot" aria-hidden="true"></span><span id="who">Signed in&hellip;</span></div></div>
    <div class="tabs" role="tablist" id="tabs" aria-label="Portal sections"></div>
    <div id="panels"></div>
  </div>
</div>

<!-- teacher claim modal -->
<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal"><h2 id="m-title">Claim this topic</h2><p class="sub" id="m-sub"></p>
    <form id="claimForm" onsubmit="confirmClaim(event)"><div id="dateOpts"></div>
      <div class="actions"><button type="button" class="btn ghost sm" onclick="closeModal('scrim')">Cancel</button><button type="submit" class="btn sm" id="claimBtn">Claim &amp; schedule</button></div>
    </form></div>
</div>

<!-- admin edit-date modal -->
<div class="scrim" id="ascrim" role="dialog" aria-modal="true" aria-labelledby="a-title">
  <div class="modal amber"><h2 id="a-title">Edit this date</h2><p class="sub" id="a-sub"></p>
    <form id="adminForm" onsubmit="submitAdminEdit(event)">
      <div class="field"><label for="a-teacher">Teacher (email)</label><input id="a-teacher" list="teacherlist" placeholder="name@truenation.org"></div>
      <div class="field" id="a-topicwrap"><label for="a-topic">Topic</label><select id="a-topic"></select></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--bark)"><input type="checkbox" id="a-cancel" style="width:auto"> Cancel this class (no session)</label>
      <div class="actions"><button type="button" class="btn amber ghost sm" onclick="clearOverride()">Reset to default</button><button type="button" class="btn ghost sm" onclick="closeModal('ascrim')">Cancel</button><button type="submit" class="btn amber sm">Save</button></div>
    </form>
    <datalist id="teacherlist"></datalist>
  </div>
</div>

<div class="toast" id="toast" role="alert"></div>
<div class="sr" role="status" aria-live="polite" id="live"></div>

<script>
  var STATE=null, ADMIN={}, current='', pendingClaim=null, adminEdit=null;
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
  function nameFromEmail(e){return e?cap(e.split('@')[0]):'';}
  function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function ordinal(n){return ['','1st','2nd','3rd','4th','5th'][n]||n+'th';}

  function load(){google.script.run.withSuccessHandler(onState).withFailureHandler(onErr).getPortalState();}
  function onErr(e){document.getElementById('loading').innerHTML='<p style="color:#7C1316">Could not load: '+esc(e.message||e)+'</p>';}
  function onState(s){
    STATE=s;
    document.getElementById('who').textContent='Signed in: '+(s.myName||nameFromEmail(s.me))+(s.isAdmin?' · Admin':'');
    document.getElementById('loading').style.display='none';
    document.getElementById('main').style.display='block';
    buildTabs(); if(!current) current=STATE.classes[0].key; show(current);
  }

  function buildTabs(){
    var t=document.getElementById('tabs'); t.innerHTML='';
    STATE.classes.forEach(function(c){t.insertAdjacentHTML('beforeend','<button class="tab" role="tab" id="tb-'+c.key+'" onclick="show(\''+c.key+'\')">'+esc(c.name)+'</button>');});
    t.insertAdjacentHTML('beforeend','<button class="tab" role="tab" id="tb-__mine" onclick="show(\'__mine\')">My teaching</button>');
    if(STATE.isAdmin) t.insertAdjacentHTML('beforeend','<button class="tab admin" role="tab" id="tb-__admin" onclick="show(\'__admin\')">Admin</button>');
    var p=document.getElementById('panels'); p.innerHTML='';
    STATE.classes.forEach(function(c){p.insertAdjacentHTML('beforeend','<section class="panel" id="pn-'+c.key+'" role="tabpanel"></section>');});
    p.insertAdjacentHTML('beforeend','<section class="panel" id="pn-__mine" role="tabpanel"></section>');
    if(STATE.isAdmin) p.insertAdjacentHTML('beforeend','<section class="panel" id="pn-__admin" role="tabpanel"></section>');
  }

  function show(key){
    current=key;
    STATE.classes.forEach(function(c){setSel(c.key,key===c.key);});
    setSel('__mine',key==='__mine'); if(STATE.isAdmin)setSel('__admin',key==='__admin');
    if(key==='__mine')renderMine();
    else if(key==='__admin')renderAdmin();
    else{var c=cls(key); c.mode==='claim'?renderClaim(c):renderAssigned(c);}
  }
  function setSel(k,on){var tb=document.getElementById('tb-'+k),pn=document.getElementById('pn-'+k);if(tb)tb.setAttribute('aria-selected',on);if(pn)pn.classList.toggle('active',on);}
  function cls(k){return STATE.classes.filter(function(c){return c.key===k;})[0];}

  /* ---------- claim class ---------- */
  function renderClaim(c){
    var open=c.topics.filter(function(t){return t.status==='Open';});
    var pct=Math.max(2,Math.round(c.counts.claimed/c.counts.total*100));
    var h='<div class="prog"><div><div class="num">'+c.counts.claimed+'</div><div class="lbl">Claimed</div></div>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div>'+
      '<div><div class="num">'+c.counts.total+'</div><div class="lbl">In the curriculum</div></div>'+
      '<p class="note">'+dayName(c.day)+' class · first come, first served. Resets and repeats when all topics are taught.</p></div>';
    h+='<h3 class="sec">Available topics ('+open.length+')</h3><div class="grid" id="bk-'+c.key+'">';
    if(!open.length)h+='<div class="empty">Every topic is claimed right now.</div>';
    open.forEach(function(t){h+='<div class="card">'+(t.ref?'<span class="ref">'+esc(t.ref)+'</span>':'')+'<h4>'+esc(t.name)+'</h4>'+(t.desc?'<p>'+esc(t.desc)+'</p>':'<p></p>')+'<button class="btn sm" onclick="openClaim(\''+c.key+'\',\''+t.id+'\')">Claim topic</button></div>';});
    h+='</div><h3 class="sec">'+dayName(c.day)+' schedule</h3>'+scheduleHTML(c,false);
    document.getElementById('pn-'+c.key).innerHTML=h;
  }

  /* ---------- assigned class ---------- */
  function renderAssigned(c){
    var mineNext=c.schedule.filter(function(r){return r.teacherEmail===STATE.me&&!r.canceled;})[0];
    var banner=mineNext?'<div class="prog"><div class="datebox"><div class="mo">'+mineNext.month+'</div><div class="dy">'+mineNext.day+'</div></div><div><div class="lbl">Your next '+dayName(c.day)+'</div><div style="font-family:Barlow Condensed;font-size:20px;font-weight:600;color:var(--wine);text-transform:uppercase">'+esc(mineNext.topicName)+'</div></div></div>':'';
    var h=banner+'<p class="subnote">Topics are taught in order and teachers are set by the '+dayName(c.day)+' rotation. Your dates are highlighted. Need to cover a week or teach an extra one? Tap <strong>Teach this date</strong> — it doesn’t change the standing rotation.</p>'+scheduleHTML(c,false);
    document.getElementById('pn-'+c.key).innerHTML=h;
  }

  function scheduleHTML(c,admin){
    var h='';
    c.schedule.forEach(function(r){
      var mine=r.teacherEmail===STATE.me;
      var pill=r.canceled?'<span class="pill cx">Canceled</span>':(r.topicName?'<span class="pill '+(mine?'you':'other')+'">'+esc(r.teacherName||nameFromEmail(r.teacherEmail))+'</span>':'<span class="pill open">Open</span>');
      if(r.overridden&&!r.canceled)pill+=' <span class="pill ov">Edited</span>';
      var hi=mine&&!admin?' style="box-shadow:0 0 0 2px #F3E3C6;border-color:var(--gold)"':'';
      var actions='';
      if(admin){
        if(c.mode==='assigned')actions='<button class="btn amber ghost sm" onclick="openAdminEdit(\''+c.key+'\',\''+r.iso+'\')">Edit</button>';
        else{ if(r.topicName)actions='<button class="btn ghost sm" onclick="adminRelease(\''+c.key+'\',\''+r.topicId+'\')">Release</button>'; }
      } else {
        if(c.mode==='claim'&&r.claimedByEmail===STATE.me&&r.topicName)actions+='<button class="btn ghost sm" onclick="doRelease(\''+c.key+'\',\''+r.topicId+'\')">Release topic</button>';
        if(r.topicName&&!r.canceled){
          if(!mine)actions+='<button class="btn ghost sm" onclick="grabDate(\''+c.key+'\',\''+r.iso+'\')">Teach this date</button>';
          else if(r.overridden)actions+='<button class="btn ghost sm" onclick="giveBack(\''+c.key+'\',\''+r.iso+'\')">Give back</button>';
        }
      }
      h+='<div class="row"'+hi+'><div class="datebox"><div class="mo">'+r.month+'</div><div class="dy">'+r.day+'</div></div>'+
         '<div class="info"><div class="t">'+(r.topicName?esc(r.topicName):'Topic not yet chosen')+'</div><div class="m">'+ordinal(r.nth)+' '+dayName(c.day)+' · Teacher: '+esc(nameFromEmail(r.teacherEmail)||'—')+'</div></div>'+pill+actions+'</div>';
    });
    return h||'<div class="empty">No upcoming dates.</div>';
  }

  /* ---------- my teaching ---------- */
  function renderMine(){
    var p=document.getElementById('pn-__mine');
    if(!STATE.mine.length){p.innerHTML='<div class="empty">Nothing scheduled for you yet. Claim a Bible Basics topic, or check your assigned World History dates.</div>';return;}
    var h='<p class="subnote">Every upcoming date assigned to you, across all classes.</p>';
    STATE.mine.forEach(function(m){var d=new Date(m.iso.replace(/-/g,'/'));
      h+='<div class="row"><div class="datebox"><div class="mo">'+m.month+'</div><div class="dy">'+m.day+'</div></div><div class="info"><div class="t">'+esc(m.topicName)+'</div><div class="m">'+esc(m.className)+' · '+weekday(d)+', '+MONTHS[d.getMonth()]+' '+d.getDate()+'</div></div>'+(m.mode==='claim'?'<button class="btn ghost sm" onclick="doRelease(\''+classKeyFor(m.className)+'\',\''+m.topicId+'\')">Release</button>':'<span class="pill other">Assigned</span>')+'</div>';});
    p.innerHTML=h;
  }
  function classKeyFor(name){var c=STATE.classes.filter(function(x){return x.name===name;})[0];return c?c.key:'';}

  /* ---------- claim modal ---------- */
  function openClaim(key,id){
    pendingClaim={key:key,id:id}; var c=cls(key),t=c.topics.filter(function(x){return x.id===id;})[0];
    document.getElementById('m-sub').innerHTML='<strong>'+esc(t.name)+'</strong>'+(t.ref?' — '+esc(t.ref):'');
    var mineD=c.openDates.filter(function(o){return o.mine;}),other=c.openDates.filter(function(o){return !o.mine;});
    var html='';
    if(mineD.length)html+='<fieldset><legend>Your rotation '+dayName(c.day)+'s</legend>'+mineD.map(optHTML).join('')+'</fieldset>';
    if(other.length)html+='<fieldset><legend>'+(mineD.length?'Or sub in on an open '+dayName(c.day):'Open '+dayName(c.day)+'s')+'</legend>'+other.map(optHTML).join('')+'</fieldset>';
    if(!c.openDates.length)html='<p class="subnote">No upcoming dates are open.</p>';
    document.getElementById('dateOpts').innerHTML=html;
    var f=document.querySelector('#dateOpts input'); if(f)f.checked=true;
    document.getElementById('claimBtn').disabled=!c.openDates.length;
    openModal('scrim'); if(f)f.focus();
  }
  function optHTML(o){return '<label class="opt"><input type="radio" name="date" value="'+o.iso+'"><span class="od">'+o.label+'</span></label>';}
  function confirmClaim(e){e.preventDefault();var sel=document.querySelector('input[name="date"]:checked');if(!sel||!pendingClaim)return;
    var b=document.getElementById('claimBtn');b.disabled=true;b.textContent='Claiming…';
    google.script.run.withSuccessHandler(function(res){b.disabled=false;b.textContent='Claim & schedule';
      if(res.ok){STATE=res.state;closeModal('scrim');show(pendingClaim.key);toast('Claimed and scheduled.');announce('Topic claimed.');}
      else{toast(res.reason,true);announce(res.reason);}
    }).withFailureHandler(function(er){b.disabled=false;b.textContent='Claim & schedule';toast(er.message||String(er),true);}).claimTopic(pendingClaim.key,pendingClaim.id,sel.value);
  }
  function doRelease(key,id){google.script.run.withSuccessHandler(function(res){if(res.ok){STATE=res.state;show(current);toast('Released.');}else toast(res.reason,true);}).withFailureHandler(function(er){toast(er.message||String(er),true);}).releaseTopic(key,id);}
  function grabDate(key,iso){google.script.run.withSuccessHandler(function(res){if(res.ok){STATE=res.state;show(current);toast('You’re teaching that date.');announce('You are now teaching that date.');}else toast(res.reason,true);}).withFailureHandler(function(er){toast(er.message||String(er),true);}).grabDate(key,iso);}
  function giveBack(key,iso){google.script.run.withSuccessHandler(function(res){if(res.ok){STATE=res.state;show(current);toast('Given back to the rotation.');}else toast(res.reason,true);}).withFailureHandler(function(er){toast(er.message||String(er),true);}).releaseDate(key,iso);}

  /* ---------- ADMIN ---------- */
  function renderAdmin(){
    var p=document.getElementById('pn-__admin');
    var keys=STATE.classes.map(function(c){return c.key;});
    if(!current_admin_class)current_admin_class=keys[0];
    var picker='<div class="classpick">'+STATE.classes.map(function(c){return '<button class="btn '+(c.key===current_admin_class?'amber':'amber ghost')+' sm" onclick="pickAdmin(\''+c.key+'\')">'+esc(c.name)+'</button>';}).join('')+'</div>';
    p.innerHTML=picker+'<div id="adminbody"><div class="loading"><div class="spin"></div>Loading…</div></div>';
    google.script.run.withSuccessHandler(function(d){ADMIN[d.key]=d;renderAdminBody(d);}).withFailureHandler(function(er){document.getElementById('adminbody').innerHTML='<p style="color:#7C1316">'+esc(er.message||er)+'</p>';}).getAdminData(current_admin_class);
  }
  var current_admin_class='';
  function pickAdmin(k){current_admin_class=k;renderAdmin();}
  function renderAdminBody(d){
    var h='<div class="adminbox"><h3>Teacher rotation — '+esc(d.name)+'</h3><p class="subnote">Change who teaches each slot. Blank removes the teacher from that slot.</p>';
    for(var n=1;n<=5;n++){var em=d.rotation[n]||'';h+='<div class="rotrow"><label>'+ordinal(n)+' of month</label><input id="rot-'+n+'" list="teacherlist" value="'+esc(em)+'" placeholder="name@truenation.org"><button class="btn amber sm" onclick="saveRotation(\''+d.key+'\','+n+')">Save</button></div>';}
    h+='</div>';
    if(d.mode==='assigned'){
      h+='<div class="adminbox"><h3>Teaching order</h3><p class="subnote">Change a topic\'s position in the sequence.</p><div class="assignrow"><select id="ord-topic">'+d.topics.map(function(t){return '<option value="'+t.id+'">#'+t.order+' — '+esc(t.name)+'</option>';}).join('')+'</select><input id="ord-num" type="number" min="1" style="width:90px" placeholder="new #"><button class="btn amber sm" onclick="saveOrder(\''+d.key+'\')">Apply</button></div></div>';
    } else {
      h+='<div class="adminbox"><h3>Assign a topic to a teacher</h3><div class="assignrow"><select id="asg-topic">'+d.topics.filter(function(t){return t.status==='Open';}).map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>';}).join('')+'</select><input id="asg-teacher" list="teacherlist" placeholder="teacher email" style="min-width:180px"><input id="asg-date" type="date"><button class="btn amber sm" onclick="assignClaim(\''+d.key+'\')">Assign</button></div><p class="subnote">Date must be a '+dayName(cls(d.key)?cls(d.key).day:0)+' that isn\'t already taken.</p></div>';
    }
    h+='<h3 class="sec">Schedule — click Edit to override</h3>'+scheduleHTML({key:d.key,mode:d.mode,day:(cls(d.key)?cls(d.key).day:0),schedule:d.schedule},true);
    document.getElementById('adminbody').innerHTML=h;
    fillTeacherList();
  }
  function saveRotation(key,n){var v=document.getElementById('rot-'+n).value.trim().toLowerCase();
    adminRun('adminSetRotation',[key,n,v],'Rotation updated.',true);}
  function saveOrder(key){var id=document.getElementById('ord-topic').value,num=document.getElementById('ord-num').value;
    if(!num){toast('Enter a new position number.',true);return;} adminRun('adminReorder',[key,id,Number(num)],'Order updated.',true);}
  function assignClaim(key){var id=document.getElementById('asg-topic').value,te=document.getElementById('asg-teacher').value.trim().toLowerCase(),dt=document.getElementById('asg-date').value;
    if(!te||!dt){toast('Pick a teacher and date.',true);return;} adminRun('adminAssignClaim',[key,id,dt,te],'Assigned.',true);}
  function adminRelease(key,id){adminRun('releaseTopic',[key,id],'Released.',true);}

  function openAdminEdit(key,iso){
    var d=ADMIN[key],r=d.schedule.filter(function(x){return x.iso===iso;})[0]; adminEdit={key:key,iso:iso};
    document.getElementById('a-sub').innerHTML=weekdayISO(iso)+' · default: '+esc(r.teacherName||nameFromEmail(r.teacherEmail)||'—');
    document.getElementById('a-teacher').value=r.teacherEmail||'';
    var sel=document.getElementById('a-topic');sel.innerHTML=d.topics.map(function(t){return '<option value="'+t.id+'"'+(t.id===r.topicId?' selected':'')+'>'+esc(t.name)+'</option>';}).join('');
    document.getElementById('a-cancel').checked=!!r.canceled;
    fillTeacherList(); openModal('ascrim'); document.getElementById('a-teacher').focus();
  }
  function submitAdminEdit(e){e.preventDefault();var te=document.getElementById('a-teacher').value.trim().toLowerCase(),tp=document.getElementById('a-topic').value,cx=document.getElementById('a-cancel').checked;
    google.script.run.withSuccessHandler(function(res){if(res.ok){STATE=res.state;closeModal('ascrim');delete ADMIN[adminEdit.key];renderAdmin();toast('Date updated.');}else toast(res.reason,true);}).withFailureHandler(function(er){toast(er.message||String(er),true);}).adminSetOverride(adminEdit.key,adminEdit.iso,te,tp,cx);
  }
  function clearOverride(){if(!adminEdit)return;google.script.run.withSuccessHandler(function(res){if(res.ok){STATE=res.state;closeModal('ascrim');delete ADMIN[adminEdit.key];renderAdmin();toast('Reset to default.');}else toast(res.reason,true);}).withFailureHandler(function(er){toast(er.message||String(er),true);}).adminClearOverride(adminEdit.key,adminEdit.iso);}

  function adminRun(fn,args,msg,reloadAdmin){
    var r=google.script.run.withSuccessHandler(function(res){if(res.ok){STATE=res.state;if(reloadAdmin){delete ADMIN[current_admin_class];renderAdmin();}toast(msg);}else toast(res.reason,true);}).withFailureHandler(function(er){toast(er.message||String(er),true);});
    r[fn].apply(r,args);
  }
  function fillTeacherList(){
    var set={};STATE.classes.forEach(function(c){for(var k in c.rotation)if(c.rotation[k])set[c.rotation[k]]=1;});
    document.getElementById('teacherlist').innerHTML=Object.keys(set).map(function(e){return '<option value="'+e+'">';}).join('');
  }

  /* ---------- utils ---------- */
  function openModal(id){document.getElementById(id).classList.add('show');}
  function closeModal(id){document.getElementById(id).classList.remove('show');}
  function toast(m,e){var t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(function(){t.className='toast';},3800);}
  function announce(m){document.getElementById('live').textContent=m;}
  function weekday(d){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];}
  function weekdayISO(iso){var d=new Date(iso.replace(/-/g,'/'));return weekday(d)+', '+MONTHS[d.getMonth()]+' '+d.getDate();}
  function dayName(n){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n]||'';}
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){closeModal('scrim');closeModal('ascrim');return;}
    if(e.key==='Tab'){
      var modal=document.querySelector('.scrim.show .modal');
      if(!modal)return;
      var f=modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])');
      if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  load();
</script>
</body>
</html>
